name: Validar Perseus

on:
  push:
    branches:
      - feat/nova-interface
  pull_request:
    branches:
      - main

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes Python
        run: python -m unittest discover -v

      - name: Testes da interface
        run: node --test test_interface.cjs

      - name: Empacotar código validado
        if: success() && matrix.os == 'ubuntu-latest'
        run: zip -r perseus-validado.zip . -x '.git/*' 'perseus-validado.zip'

      - name: Salvar artefato para validação real
        if: success() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: perseus-validado
          path: perseus-validado.zip
          retention-days: 1
